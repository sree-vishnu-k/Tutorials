<!DOCTYPE html>
<html>
<head>
<title>Button Example</title>
<style>
   .subscribe-btn{
        background-color: rgb(208, 3, 3);
        color: white;
        border: none;
        border-radius: 2px;
        padding-left: 15px;
        padding-right: 15px;
        padding-top: 10px;
        padding-bottom: 10px;
        font-family: Helvetica, sans-serif;
        font-size: 14px;
        cursor: pointer;
        margin-right: 9px;
        transition: opacity 0.15s;
    } 
    .subscribe-btn:hover{
        opacity: 0.7;
    }
    .subscribe-btn:active{
       opacity: 0.5;
    }
    .join-btn{
        background-color: rgb(255, 255, 255);
        color: #2d5fdb;
        border: 1px solid #2d5fdb;
        border-radius: 2px;
        padding-left: 15px;
        padding-right: 15px;
        padding-top: 9px;
        padding-bottom: 9px;
        font-family: Helvetica, sans-serif;
        font-size: 14px;
        cursor: pointer;
        margin-right: 9px;
        transition: background-color 0.15s, color 0.15s;
    }
    .join-btn:hover{
        background-color:  #2d5fdb;
        color: white;
    }
    .join-btn:active{
        opacity: 0.6;
    }
    .tweet-btn{
        background-color: #3c9be8;
        color: #ffffff;
        border: none;
        border-radius: 20px;
        padding-left: 15px;
        padding-right: 15px;
        padding-top: 10px;
        padding-bottom: 10px;
        font-family: Helvetica, sans-serif;
        font-size: 15px;
        cursor: pointer;
        font-weight: bold;
        transition: box-shadow 0.15s;
    }
    .tweet-btn:hover{
        box-shadow: 0px 3px 10px 0px #c6c6ce;
    }
    
</style>
</head>
<body>
<button class="subscribe-btn">
    SUBSCRIBE
</button>
<button class="join-btn">
    JOIN MY COMMUNITY
</button>
<button class="tweet-btn">
    Tweet
</button>
</body>
</html>
